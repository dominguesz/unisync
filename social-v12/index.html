  .us-install-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--violet,#0b6fc2);background:var(--white,#fff);border:1px solid var(--line,#dbe6f1);padding:9px 12px;border-radius:12px;font:600 12px Inter,system-ui,sans-serif;white-space:nowrap}

    .auth-card .us-entry-apk{display:flex;gap:12px;justify-content:center;background:linear-gradient(115deg,var(--violet,#0b6fc2),var(--violet-2,#1a8fe3));color:white;border:0;min-height:58px;padding:12px 14px;border-radius:15px;margin:6px 0 0;box-shadow:0 6px 16px #162d4c22;white-space:normal;text-align:left}.us-entry-apk svg{width:24px;height:24px;flex-shrink:0}.us-entry-apk strong,.us-entry-apk small{display:block;color:white!important}.us-entry-apk strong{font-size:14px;line-height:1.3}.us-entry-apk small{font-size:11px;margin-top:3px;font-weight:500;opacity:.95}.us-install-help{display:block;text-align:center;color:var(--violet,#0b6fc2);font-size:12px;font-weight:600;margin:8px 0 14px;text-underline-offset:3px}html[data-theme="dark"] .us-install-help{color:#b8d8ff}
